<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Trade Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6">

<h1 class="text-3xl font-bold mb-2">📈 My Trade Portfolio</h1>
<p class="text-gray-400 mb-6">Public read-only view • Data from Ghostfolio JSON</p>

<div id="status" class="mb-4 text-yellow-400">Loading portfolio…</div>

<div class="overflow-x-auto">
  <table class="w-full border border-gray-800 rounded-lg">
    <thead class="bg-gray-900">
      <tr>
        <th class="p-3 text-left">Symbol</th>
        <th class="p-3 text-right">Quantity</th>
        <th class="p-3 text-right">Avg Buy</th>
        <th class="p-3 text-right">Invested Value</th>
      </tr>
    </thead>
    <tbody id="portfolio"></tbody>
  </table>
</div>

<script>
// SAFE VERSION FOR GITHUB PAGES (NO EXTERNAL PRICE APIS)
fetch('./ghostfolio-export-202512301927.json')
  .then(res => {
    if (!res.ok) throw new Error('JSON file not found');
    return res.json();
  })
  .then(data => {
    buildPortfolio(data.activities);
    document.getElementById('status').textContent = 'Portfolio loaded successfully';
  })
  .catch(err => {
    document.getElementById('status').textContent = 'Error loading data: ' + err.message;
  });

const holdings = {};

function buildPortfolio(activities) {
  activities.forEach(a => {
    if (a.type !== 'BUY') return;
    if (!holdings[a.symbol]) {
      holdings[a.symbol] = { qty: 0, cost: 0 };
    }
    holdings[a.symbol].qty += a.quantity;
    holdings[a.symbol].cost += a.quantity * a.unitPrice;
  });

  const tbody = document.getElementById('portfolio');
  tbody.innerHTML = '';

  Object.entries(holdings).forEach(([symbol, h]) => {
    const avg = h.cost / h.qty;
    const row = document.createElement('tr');
    row.className = 'border-t border-gray-800';
    row.innerHTML = `
      <td class="p-3">${symbol}</td>
      <td class="p-3 text-right">${h.qty.toLocaleString()}</td>
      <td class="p-3 text-right">$${avg.toFixed(2)}</td>
      <td class="p-3 text-right">$${h.cost.toLocaleString()}</td>
    `;
    tbody.appendChild(row);
  });
}
</script>

</body>
</html>
